name: Steampipe Anywhere Components

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release (must be prefixed with 'v')"
        required: true

  workflow_call:

permissions:
  contents: write

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out steampipe-export
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: "turbot/steampipe-export"
          ref: 1dfeb24204afc23c4746fd41245402aba811649f # main

      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV

      - name: Get latest version tag
        run: |-
          echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          echo "Version: ${VERSION}"

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      - name: Setup GoLang
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: 1.26

      - name: Fetch plugin module
        run: |
          # Extract major version if present (e.g. v2 from v2.0.1)
          MAJOR_VERSION=$(echo $VERSION | grep -o '^v[0-9]\+' || echo "v1")
          # v0 and v1 don't need version in path, v2+ do
          if [ "$MAJOR_VERSION" = "v1" ] || [ "$MAJOR_VERSION" = "v0" ]; then
            go get github.com/pluralsh/steampipe-plugin-${{ env.PLUGIN_NAME }}@$VERSION
          else
            go get github.com/pluralsh/steampipe-plugin-${{ env.PLUGIN_NAME }}/${MAJOR_VERSION}@$VERSION
          fi

  build-postgres-15-fdw-linux-amd64:
    name: Build Postgres 15 FDW for Linux - AMD64
    needs: get-version
    runs-on: ubuntu-22.04

    steps:
      - name: Check architecture
        run: uname -a

      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV
          echo "PLUGIN_GITHUB_URL=github.com/pluralsh/steampipe-plugin-${plugin_name}" >> $GITHUB_ENV

      - name: Check out steampipe-postgres-fdw
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: "pluralsh/steampipe-postgres-fdw"
          ref: 32b5cb187302f0208b23fbd582e87fc7a0274c3d # v2.2.3

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      - name: Setup GoLang
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: 1.26

      - name: Setup apt-get
        run: |-
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo env ACCEPT_EULA=Y apt-get update
          sudo env ACCEPT_EULA=Y apt-get upgrade

      - name: Install PostgreSQL15 Dev
        run: |-
          sudo apt-get -y install postgresql-server-dev-15

      - name: Find stuff and set env
        run: |-
          PG_CONFIG=/usr/lib/postgresql/15/bin/pg_config
          "$PG_CONFIG" --version

          echo "$("$PG_CONFIG" --bindir)" >> "$GITHUB_PATH"
          echo "PG_CONFIG=${PG_CONFIG}" >> "$GITHUB_ENV"

          SERVER_LIB=$("$PG_CONFIG" --includedir-server)
          INTERNAL_LIB=$("$PG_CONFIG" --includedir)/internal

          CFLAGS="$("$PG_CONFIG" --cflags) -I${SERVER_LIB} -I${INTERNAL_LIB} -g"
          LDFLAGS=$("$PG_CONFIG" --ldflags)

          echo "CFLAGS=${CFLAGS}" >> "$GITHUB_ENV"
          echo "PG_CFLAGS=${CFLAGS}" >> "$GITHUB_ENV"
          echo "LDFLAGS=${LDFLAGS}" >> "$GITHUB_ENV"
          echo "PG_LDFLAGS=${LDFLAGS}" >> "$GITHUB_ENV"

          ls -la "$SERVER_LIB"
          ls -la "$INTERNAL_LIB"

      - name: Build steampipe-postgres-fdw-anywhere
        run: |
          pwd
          ls -ltr
          make clean
          make V=1 standalone plugin=${{ env.PLUGIN_NAME }} plugin_version=${{ env.VERSION }} plugin_github_url=${{ env.PLUGIN_GITHUB_URL }} PG_CONFIG="${{ env.PG_CONFIG }}" CFLAGS="${{ env.CFLAGS }}" PG_CFLAGS="${{ env.PG_CFLAGS }}" LDFLAGS="${{ env.LDFLAGS }}" PG_LDFLAGS="${{ env.PG_LDFLAGS }}"
          ls -ltr

      - name: Rename and zip the build-Linux folder
        run: |-
          mv build-Linux steampipe_postgres_${{ env.PLUGIN_NAME }}.pg15.linux_amd64
          tar -czvf steampipe_postgres_${{ env.PLUGIN_NAME }}.pg15.linux_amd64.tar.gz steampipe_postgres_${{ env.PLUGIN_NAME }}.pg15.linux_amd64

      - name: Save Linux Build Artifact - AMD64
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: steampipe_postgres_${{ env.PLUGIN_NAME }}.pg15.linux_amd64.tar.gz
          path: steampipe_postgres_${{ env.PLUGIN_NAME }}.pg15.linux_amd64.tar.gz
          if-no-files-found: error

  build-postgres-15-fdw-linux-arm64:
    name: Build Postgres 15 FDW for Linux - ARM64
    needs: get-version
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Check architecture
        run: uname -a

      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV
          echo "PLUGIN_GITHUB_URL=github.com/pluralsh/steampipe-plugin-${plugin_name}" >> $GITHUB_ENV

      - name: Check out steampipe-postgres-fdw
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          repository: "pluralsh/steampipe-postgres-fdw"
